services:
  - type: web
    name: us-brand-atlas
    runtime: static
    repo: https://github.com/huangchunbo2025/us-brand-atlas
    branch: main
    buildCommand: ""
    staticPublishPath: ./public
    autoDeployTrigger: commit
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
